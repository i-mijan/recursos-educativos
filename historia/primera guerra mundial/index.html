<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Primera Guerra Mundial · Atlas interactivo 1914-1923</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Old+Standard+TT:ital,wght@0,400;0,700;1,400&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
<style>:root{
 --paper:#E6E7E0;--card:#F4F4EF;--card2:#ECEDE5;--ink:#1B2530;--ink2:#46515E;--ink3:#6B7581;--rule:#B8BAAE;
 --sea:#CCDBE1;--land:#DAD8C8;--al:#2B5E8C;--cp:#A5352C;--neu:#CBC4AA;--out:#8E9097;--new:#1F7A6B;--gold:#8A6B2B;
 --serif:'Old Standard TT','Iowan Old Style',Georgia,'Times New Roman',serif;--sans:'Source Sans 3','Segoe UI',system-ui,-apple-system,Roboto,Arial,sans-serif;
 --r:6px;
}
@media (prefers-color-scheme:dark){
 :root:not([data-theme="light"]){--paper:#1A1F25;--card:#232A32;--card2:#2B333C;--ink:#E7E8E4;--ink2:#B7BDC4;--ink3:#8A929B;--rule:#434B54;--sea:#26333D;--land:#3A3F44;--neu:#6B6755;--out:#6B6E75;}
}
:root[data-theme="dark"]{--paper:#1A1F25;--card:#232A32;--card2:#2B333C;--ink:#E7E8E4;--ink2:#B7BDC4;--ink3:#8A929B;--rule:#434B54;--sea:#26333D;--land:#3A3F44;--neu:#6B6755;--out:#6B6E75;}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.5 var(--sans);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
button{font:inherit;color:inherit;cursor:pointer}
h1,h2,h3,h4{font-family:var(--serif);font-weight:700;margin:0 0 .4em;line-height:1.2;color:var(--ink)}
p{margin:0 0 .7em}
.app{max-width:1560px;margin:0 auto;padding:0 14px 28px}
/* header */
.hd{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;justify-content:space-between;padding:18px 0 10px;border-bottom:3px double var(--rule)}
.hd h1{font-size:clamp(26px,4.2vw,46px);letter-spacing:.04em;margin:0}
.hd .sub{font-family:var(--serif);font-size:clamp(15px,2vw,21px);color:var(--ink2);font-style:italic;margin:2px 0 0}
.hd .sub2{font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink3);margin-top:4px}
.tools{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--ink);background:transparent;padding:7px 13px;border-radius:var(--r);font-size:14px;font-weight:600;min-height:38px}
.btn:hover{background:var(--ink);color:var(--paper)}
.btn.pri{background:var(--ink);color:var(--paper)}
.btn.pri:hover{background:var(--al);border-color:var(--al)}
.btn.on{background:var(--gold);border-color:var(--gold);color:#fff}
.btn.sm{padding:4px 9px;min-height:30px;font-size:13px}
/* nav */
.nav{display:flex;gap:2px;overflow-x:auto;margin:10px 0 0;padding-bottom:4px;scrollbar-width:thin;border-bottom:1px solid var(--rule)}
.nav button{flex:0 0 auto;border:0;background:transparent;padding:9px 11px;font-size:12.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--ink2);border-bottom:3px solid transparent;white-space:nowrap}
.nav button .n{font-family:var(--serif);color:var(--ink3);margin-right:5px}
.nav button:hover{color:var(--ink)}
.nav button.on{color:var(--ink);border-bottom-color:var(--cp)}
/* hilo causal */
.hilo{display:flex;flex-wrap:wrap;gap:4px;margin:8px 0 12px;font-size:12px}
.hilo button{border:1px solid var(--rule);background:var(--card);padding:3px 8px;border-radius:99px;color:var(--ink2)}
.hilo button.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.hilo span{color:var(--ink3);align-self:center}
/* layout */
.layout{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:14px;align-items:start}
@media (max-width:980px){.layout{grid-template-columns:1fr}}
.panel{background:var(--card);border:1px solid var(--rule);border-radius:var(--r);padding:14px}
.panel h3{font-size:19px}
.panel h4{font-size:15px;margin-top:12px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px}
.chip{border:1px solid var(--rule);background:var(--card);padding:5px 11px;border-radius:99px;font-size:13.5px;font-weight:600;min-height:32px}
.chip.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.chip .dot{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px}
.lbl{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink3);font-weight:700}
/* map */
.mapwrap{position:relative;background:var(--sea);border:1px solid var(--rule);border-radius:var(--r);overflow:hidden;touch-action:pan-y}
.mapwrap svg{display:block;width:100%;height:auto;max-height:78vh}
.mapwrap .zoom{position:absolute;right:8px;top:8px;display:flex;flex-direction:column;gap:4px}
.mapwrap .zoom button{width:32px;height:32px;border:1px solid var(--rule);background:var(--card);border-radius:4px;font-weight:700;font-size:16px;line-height:1}
.mapwrap .cap{position:absolute;left:8px;bottom:6px;font-size:11px;color:var(--ink2);background:color-mix(in srgb,var(--card) 80%,transparent);padding:2px 7px;border-radius:3px}
svg .reg{stroke:#2a323b;stroke-width:.7;stroke-linejoin:round;cursor:pointer;transition:opacity .15s,fill .25s;vector-effect:non-scaling-stroke}
svg .reg:hover{opacity:.82}
svg .reg.sel{stroke:#000;stroke-width:2.2}
svg .reg.dim{opacity:.35}
svg .land{fill:var(--land);stroke:#555;stroke-width:.5;vector-effect:non-scaling-stroke}
svg .sea{fill:var(--sea)}
svg .lab{font-family:var(--sans);font-weight:700;fill:#1b2530;paint-order:stroke;stroke:rgba(255,255,255,.75);stroke-width:2.4px;pointer-events:none;text-anchor:middle;letter-spacing:.02em}
svg .sealab{font-family:var(--serif);font-style:italic;fill:#5b7885;text-anchor:middle;pointer-events:none;letter-spacing:.2em}
svg .front{fill:none;stroke:#111;stroke-width:2.1;stroke-linejoin:round;stroke-linecap:round;vector-effect:non-scaling-stroke}
svg .front.dash{stroke-dasharray:6 4;stroke-width:1.7}
svg .occ{pointer-events:none}
svg .arrow{fill:none;stroke-width:2.6;vector-effect:non-scaling-stroke;stroke-linecap:round}
svg .arrow.cp{stroke:var(--cp)}svg .arrow.al{stroke:var(--al)}
svg .mk{cursor:pointer}
svg .mk .c{fill:#fff;stroke:#111;stroke-width:1.6;vector-effect:non-scaling-stroke}
svg .mk .x{stroke:#111;stroke-width:1.8;vector-effect:non-scaling-stroke}
svg .mk.past{opacity:.38}
svg .mk:hover .c{fill:#ffe9a6}
svg .mk .t{font-size:8px;font-weight:700;fill:#111;paint-order:stroke;stroke:rgba(255,255,255,.85);stroke-width:2.4px}
svg .cap-dot{fill:#111;stroke:#fff;stroke-width:1;pointer-events:none}
svg .plc{font-size:8.5px;font-weight:600;fill:#222;paint-order:stroke;stroke:rgba(255,255,255,.9);stroke-width:2.4px;pointer-events:none}
svg .grat{fill:none;stroke:#7d98a3;stroke-width:.4;opacity:.45;vector-effect:non-scaling-stroke}
/* legend */
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;margin:8px 0 0;color:var(--ink2)}
.legend i{display:inline-block;width:16px;height:11px;border:1px solid #333;margin-right:5px;vertical-align:-1px}
.callout{border-left:4px solid var(--gold);background:var(--card2);padding:9px 12px;border-radius:0 var(--r) var(--r) 0;font-size:14.5px;margin:10px 0}
.callout.warn{border-left-color:var(--cp)}
.callout b{font-family:var(--serif)}
/* ficha */
.ficha dl{margin:0;display:grid;grid-template-columns:110px 1fr;gap:5px 10px;font-size:14px}
.ficha dt{font-weight:700;color:var(--ink3);font-size:12px;letter-spacing:.06em;text-transform:uppercase;padding-top:2px}
.ficha dd{margin:0}
.ficha .tag{display:inline-block;padding:1px 8px;border-radius:99px;font-size:12px;font-weight:700;color:#fff;margin-bottom:6px}
.tag.al{background:var(--al)}.tag.cp{background:var(--cp)}.tag.neu{background:#7b7660}.tag.new{background:var(--new)}
.empty{color:var(--ink3);font-style:italic;font-size:14px}
/* indicators */
.ind{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ind div{background:var(--card2);border-radius:var(--r);padding:8px 10px}
.ind .k{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink3);font-weight:700}
.ind .v{font-family:var(--serif);font-size:20px;font-weight:700}
.ind .w{grid-column:1/3}
.ind small{font-size:12.5px;color:var(--ink2);font-family:var(--sans);font-weight:400;display:block;line-height:1.35;margin-top:2px}
.bal{height:14px;border-radius:99px;background:linear-gradient(90deg,var(--cp),#d8d5c8 50%,var(--al));position:relative;margin:6px 0 2px}
.bal b{position:absolute;top:-4px;width:6px;height:22px;background:var(--ink);border-radius:3px;transition:left .5s}
.balt{display:flex;justify-content:space-between;font-size:11px;color:var(--ink3)}
.ev{list-style:none;margin:0;padding:0;font-size:14px}
.ev li{display:grid;grid-template-columns:78px 1fr;gap:8px;padding:4px 0;border-bottom:1px dotted var(--rule)}
.ev li b{font-family:var(--serif);font-size:13.5px}
.yrs{display:flex;gap:6px;flex-wrap:wrap}
.yrs button{border:1px solid var(--ink);background:var(--card);padding:6px 16px;border-radius:var(--r);font-family:var(--serif);font-weight:700;font-size:18px}
.yrs button.on{background:var(--ink);color:var(--paper)}
/* stepper */
.steps{list-style:none;margin:0;padding:0;counter-reset:s}
.steps li{margin:0}
.steps button{display:flex;gap:10px;width:100%;text-align:left;border:1px solid var(--rule);background:var(--card);padding:8px 10px;border-radius:var(--r);margin-bottom:6px;align-items:flex-start}
.steps button .nn{flex:0 0 26px;height:26px;border-radius:50%;background:var(--ink);color:var(--paper);font-family:var(--serif);font-weight:700;text-align:center;line-height:26px;font-size:14px}
.steps button .d{font-size:12px;color:var(--ink3);display:block}
.steps button.on{border-color:var(--cp);background:var(--card2);box-shadow:inset 3px 0 0 var(--cp)}
.steps button.done .nn{background:var(--cp)}
.flow{display:flex;flex-wrap:wrap;gap:6px;align-items:stretch;margin:8px 0}
.flow .nd{flex:1 1 150px;border:1px solid var(--rule);background:var(--card);padding:8px 10px;border-radius:var(--r);font-size:14px}
.flow .nd b{display:block;font-family:var(--serif)}
.flow .ar{align-self:center;color:var(--ink3);font-size:20px}
.stage{display:grid;grid-template-columns:1fr auto 1fr auto 1fr;gap:6px;align-items:stretch;margin:10px 0}
@media (max-width:760px){.stage{grid-template-columns:1fr}.stage .ar{transform:rotate(90deg);justify-self:center}}
.stage>div.bx{border:1px solid var(--rule);border-radius:var(--r);padding:10px;background:var(--card)}
.stage .bx h4{margin-top:0;font-size:15px;letter-spacing:.06em;text-transform:uppercase}
.stage .ar{align-self:center;font-size:24px;color:var(--ink3)}
/* cards */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.card{border:1px solid var(--rule);background:var(--card);border-radius:var(--r);padding:11px 12px;text-align:left;display:block;width:100%}
button.card:hover{border-color:var(--ink);background:var(--card2)}
.card h4{margin:0 0 3px;font-size:15.5px}
.card .m{font-size:13px;color:var(--ink3)}
.card p{font-size:14px;margin:4px 0 0}
.medal{width:54px;height:54px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-weight:700;font-size:20px;color:#fff;margin-bottom:6px;border:3px double rgba(255,255,255,.8);box-shadow:0 0 0 1px #333}
details{border:1px solid var(--rule);border-radius:var(--r);background:var(--card);margin-bottom:6px}
summary{cursor:pointer;padding:8px 12px;font-weight:700;list-style:none}
summary::-webkit-details-marker{display:none}
summary::before{content:'+';display:inline-block;width:18px;font-family:var(--serif)}
details[open] summary::before{content:'−'}
details>div{padding:0 12px 10px;font-size:14.5px}
.qa{border:1px solid var(--rule);background:var(--card);border-radius:var(--r);padding:10px 12px;margin:10px 0}
.qa .q{font-family:var(--serif);font-weight:700;font-size:16px}
.qa .a{display:none;margin-top:8px;padding-top:8px;border-top:1px dashed var(--rule);font-size:14.5px}
.qa.open .a{display:block}
.prof{display:none;border:2px solid var(--gold);background:var(--card2);border-radius:var(--r);padding:12px 14px;margin:12px 0}
body.prof .prof{display:block}
.prof h4{font-size:15px;margin:8px 0 3px;color:var(--gold)}
.prof ul{margin:0;padding-left:18px;font-size:14.5px}
.prof .tg{font-family:var(--serif);font-size:18px;font-weight:700}
.sub{display:flex;gap:6px;margin:0 0 10px;flex-wrap:wrap}
/* modal */
.mod{position:fixed;inset:0;background:rgba(10,15,20,.6);display:none;align-items:center;justify-content:center;z-index:50;padding:16px}
.mod.on{display:flex}
.mod .box{background:var(--card);border:1px solid var(--ink);border-radius:8px;max-width:760px;width:100%;max-height:88vh;overflow:auto;padding:20px 22px;position:relative}
.mod .x{position:absolute;right:10px;top:8px;border:0;background:transparent;font-size:26px;line-height:1}
.tip{position:fixed;z-index:60;pointer-events:none;background:var(--ink);color:var(--paper);padding:4px 9px;font-size:13px;border-radius:4px;display:none;max-width:260px}
.gl{border:0;background:transparent;border-bottom:1px dotted var(--ink);padding:0;font:inherit;color:inherit;cursor:help}
/* balance 1917 */
.scale{width:100%;max-width:520px;display:block;margin:0 auto}
/* slider compare */
.cmp{position:relative}
.cmp .top{position:absolute;inset:0;overflow:hidden}
.cmp .bar{position:absolute;top:0;bottom:0;width:4px;background:var(--ink);margin-left:-2px;z-index:5;pointer-events:none}
.cmp .bar::after{content:'↔';position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);background:var(--ink);color:var(--paper);width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:18px}
.cmp .yl{position:absolute;top:8px;font-family:var(--serif);font-weight:700;font-size:22px;background:var(--card);padding:1px 10px;border-radius:4px;z-index:4;border:1px solid var(--ink)}
.cmp input[type=range]{width:100%;margin:8px 0}
.cmp svg{max-height:none}
/* table */
table.tb{width:100%;border-collapse:collapse;font-size:14px}
table.tb th,table.tb td{border:1px solid var(--rule);padding:6px 9px;text-align:left;vertical-align:top}
table.tb th{background:var(--card2);font-size:12px;letter-spacing:.06em;text-transform:uppercase}
.indic{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
.indic div{flex:1 1 150px;border-radius:var(--r);padding:8px 12px;color:#fff;font-weight:700;font-family:var(--serif)}
.indic .a{background:var(--cp)}.indic .b{background:var(--new)}.indic .c{background:var(--gold)}
.bars .b{display:grid;grid-template-columns:130px 1fr 150px;gap:8px;align-items:center;font-size:13.5px;margin:4px 0}
.bars .b i{display:block;height:15px;background:var(--cp);border-radius:2px}
@media (max-width:620px){.bars .b{grid-template-columns:90px 1fr}.bars .b span:last-child{grid-column:1/3}}
/* timeline */
.tl{overflow-x:auto;padding-bottom:12px;border:1px solid var(--rule);border-radius:var(--r);background:var(--card)}
.tl .tr{display:flex;min-width:max-content}
.tl .yc{width:260px;border-right:1px solid var(--rule);padding:10px;flex:0 0 260px}
.tl .yc h3{font-size:26px;border-bottom:3px solid var(--ink);margin-bottom:8px}
.tl .ev2{width:100%;text-align:left;border:1px solid var(--rule);background:var(--card2);padding:6px 8px;border-radius:var(--r);margin-bottom:6px;border-left-width:5px}
.tl .ev2 small{display:block;color:var(--ink3);font-size:12px}
.tl .ev2.pol{border-left-color:var(--new)}.tl .ev2.mil{border-left-color:var(--cp)}.tl .ev2.dip{border-left-color:var(--al)}
/* trench */
.trench{width:100%;display:block}
.trench .hs{cursor:pointer}
.trench .hs:hover{opacity:.8}
.trench .hs.on{stroke:#fff;stroke-width:3}
/* footer */
.ft{margin-top:22px;padding-top:10px;border-top:3px double var(--rule);display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px;font-size:14px;color:var(--ink2)}
.ft b{font-family:var(--serif);color:var(--ink);font-size:16px}
/* tour */
.tour{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:40;background:var(--ink);color:var(--paper);border-radius:10px;padding:10px 14px;max-width:min(680px,94vw);display:none;box-shadow:0 4px 18px rgba(0,0,0,.35)}
.tour.on{display:block}
.tour .b{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}
.tour .btn{border-color:var(--paper);color:var(--paper);min-height:30px;padding:3px 10px}
.tour .btn:hover{background:var(--paper);color:var(--ink)}
.ord{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:760px){.ord{grid-template-columns:1fr}}
.ord li{list-style:none}
.ord button{display:block;width:100%;text-align:left;border:1px solid var(--rule);background:var(--card);padding:7px 10px;border-radius:var(--r);margin-bottom:5px;font-size:14px}
.ord ol{padding:0;margin:0;min-height:60px}
.fb.ok{color:#1d6b3a;font-weight:600}.fb.no{color:var(--cp);font-weight:600}
.sc{font-family:var(--serif);font-size:22px;font-weight:700;margin:8px 0}
.opt{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.opt button{border:1px solid var(--rule);background:var(--card);padding:6px 11px;border-radius:99px;font-size:14px}
.opt button.sel{background:var(--ink);color:var(--paper)}
.opt button.ok{background:#1d6b3a;color:#fff;border-color:#1d6b3a}
.opt button.no{background:var(--cp);color:#fff;border-color:var(--cp)}
.small{font-size:13px;color:var(--ink3)}
@media (max-width:620px){.hd{padding-top:12px}.panel{padding:11px}.ficha dl{grid-template-columns:1fr}.ficha dt{padding-top:6px}}
@media print{.nav,.tools,.zoom,.tour{display:none}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style></head>
<body>
<div class="app">
<header class="hd"><div><h1>PRIMERA GUERRA MUNDIAL</h1><p class="sub">De la crisis de 1914 al nuevo mapa del mundo</p><div class="sub2">Atlas interactivo de la Gran Guerra, 1914-1923 · 4.º ESO · Geografía e Historia</div></div>
<div class="tools"><button class="btn pri" id="btour">Comenzar recorrido</button><button class="btn" id="bprof">Modo profesor</button><button class="btn" id="bgl">Glosario</button><button class="btn" id="bfue">Fuentes</button></div></header>
<nav class="nav" id="nav" aria-label="Secciones del atlas"></nav>
<div class="hilo" id="hilo" aria-label="Estructura causal"></div>
<main id="view"></main>
<footer class="ft"><div><b>Realizado por Ismael Miján</b></div><div>Mapas esquemáticos y cifras aproximadas: contrasta con atlas y fuentes de referencia antes de usarlos como dato exacto.</div></footer>
</div>
<div class="mod" id="mod" role="dialog" aria-modal="true"><div class="box" id="modbox"></div></div>

function gratD(){let d='';for(let lo=-20;lo<=60;lo+=10){let p=[];for(let la=20;la<=70;la+=5){const q=LC(lo,la);p.push(q[0].toFixed(0)+' '+q[1].toFixed(0));}d+='M'+p.join('L');}

 const set=GEO.sets[o.set],labs=GEO.labels[o.set],L=o.lb||(o.view==='NE'?LBNE:LB);

 Object.keys(set).forEach(id=>{const f=o.fill?o.fill(id):(POL[id]||COL.none);const cl='reg'+(o.sel===id?' sel':'')+(o.dim&&o.dim(id)?' dim':'');s+=`<path class="${cl}" data-id="${id}" d="${set[id]}" fill="${f}"${o.tip?` data-tip="${esc(o.tip(id)||'')}"`:''}/>`;});
 if(o.under)s+=o.under;
 if(o.lab!==false){Object.keys(set).forEach(id=>{const l=L[id],p=labs[id];if(!l||!l[0]||!p)return;if(o.dim&&o.dim(id))return;s+=`<text class="lab" x="${p[0]}" y="${p[1]}" font-size="${(l[1]*k).toFixed(1)}">${l[0]}</text>`;});

function mapSetView(svg,v,anim){
 const cur=svg.getAttribute('viewBox').split(' ').map(Number);
 if(!anim){svg.setAttribute('viewBox',v.join(' '));return;}
 const t0=performance.now(),D=450;
 (function st(t){const p=Math.min(1,(t-t0)/D),e=p<.5?2*p*p:1-Math.pow(-2*p+2,2)/2;svg.setAttribute('viewBox',cur.map((c,i)=>(c+(v[i]-c)*e).toFixed(2)).join(' '));if(p<1)requestAnimationFrame(st);})(t0);
}
function enableMap(root,handlers={}){
 const wrap=$('.mapwrap',root);if(!wrap)return;
 const svgs=$$('svg.map',wrap);if(!svgs.length)return;
 const svg=svgs[svgs.length-1];
 let moved=false,drag=null;
 const base=()=>svg.dataset.base.split(' ').map(Number);
 const view=()=>svg.getAttribute('viewBox').split(' ').map(Number);
 function zoom(f){const v=view(),b=base();const w=Math.min(b[2]*1.0,Math.max(b[2]/6,v[2]*f)),h=w*b[3]/b[2];const cx=v[0]+v[2]/2,cy=v[1]+v[3]/2;mapSetView(svg,[cx-w/2,cy-h/2,w,h],true);}
 $$('.zoom button',wrap).forEach(b=>b.onclick=()=>{const z=b.dataset.z;if(z==='in')zoom(.7);else if(z==='out')zoom(1.4);else mapSetView(svg,base(),true);});
 svg.addEventListener('pointerdown',e=>{if(e.button&&e.button!==0)return;const v=view();drag={x:e.clientX,y:e.clientY,v,sc:v[2]/svg.getBoundingClientRect().width};moved=false;});
 window.addEventListener('pointermove',e=>{if(!drag)return;const dx=e.clientX-drag.x,dy=e.clientY-drag.y;if(Math.abs(dx)+Math.abs(dy)>5)moved=true;if(moved){const v=drag.v;svg.setAttribute('viewBox',[v[0]-dx*drag.sc,v[1]-dy*drag.sc,v[2],v[3]].join(' '));}});
 window.addEventListener('pointerup',()=>{drag=null;});
 svg.addEventListener('click',e=>{if(moved){moved=false;e.stopPropagation();return;}
  const reg=e.target.closest('.reg'),mk=e.target.closest('.mk');
  if(mk&&handlers.marker){handlers.marker(mk.dataset.id,mk);return;}
  if(reg&&handlers.region){handlers.region(reg.dataset.id,reg);}
 },true);
}

 const years=[1914,1915,1916,1917,1918,1919,1920,1922,1923].filter(y=>CHRONO.some(e=>e[0]===y));
 const tn={mil:'Militar',pol:'Político y social',dip:'Diplomático'};
 root.innerHTML=`<div class="row">${[['all','Todos'],['mil','Militar'],['dip','Diplomático'],['pol','Político y social']].map(c=>`<button class="chip ${c[0]===f?'on':''}" data-f="${c[0]}">${c[1]}</button>`).join('')}<span class="small">Desplázate horizontalmente · pulsa un hecho</span></div><div class="row" id="jumps">${years.map(y=>`<button class="btn sm" data-j="${y}">${y}</button>`).join('')}</div><div class="tl" id="tl14"><div class="tr">${years.map(y=>`<div class="yc" id="y${y}"><h3>${y}</h3>${CHRONO.map((e,i)=>({e,i})).filter(o=>o.e[0]===y&&(f==='all'||o.e[2]===f)).map(o=>`<button class="ev2 ${o.e[2]}" data-i="${o.i}"><small>${o.e[1]}</small><b>${o.e[3]}</b></button>`).join('')||'<p class="small">Sin hechos para este filtro.</p>'}</div>`).join('')}</div></div><div class="legend"><span><i style="background:var(--cp)"></i>Militar</span><span><i style="background:var(--al)"></i>Diplomático</span><span><i style="background:var(--new)"></i>Político y social</span></div>${profBlock('t14')}`;
 $$('[data-f]',root).forEach(b=>b.onclick=()=>{S.f14=b.dataset.f;T14(root);});
 $$('[data-j]',root).forEach(b=>b.onclick=()=>{const el=$('#y'+b.dataset.j);$('#tl14').scrollTo({left:el.offsetLeft-12,behavior:'smooth'});});
 $$('.ev2[data-i]',root).forEach(b=>b.onclick=()=>{const e=CHRONO[+b.dataset.i];openModal(`<div class="small">${e[0]} · ${e[1]} · ${tn[e[2]]}</div><h2>${e[3]}</h2><p>${e[4]}</p>`);});
}
/* ===== T15: Explora / retos ===== */
function T15(root){
 const sub=S.sub.t15||'hub';
 const subs=[['hub','Inicio'],['rec','Reconstruye Europa'],['cam','¿Qué cambió?'],['ord','Explica la guerra'],['rep','Preguntas de repaso'],['fue','Fuentes']];
 root.innerHTML=`<div class="sub">${subs.map(s=>`<button class="chip ${s[0]===sub?'on':''}" data-s="${s[0]}">${s[1]}</button>`).join('')}</div><div id="t15c"></div>`;
 $$('.sub .chip',root).forEach(b=>b.onclick=()=>{S.sub.t15=b.dataset.s;T15(root);});
 const c=$('#t15c');
 ({hub:A_hub,rec:A_rec,cam:A_cam,ord:A_ord,rep:A_rep,fue:A_fue})[sub](c);
 root.insertAdjacentHTML('beforeend',profBlock('t15'));
}
function A_hub(c){
 c.innerHTML=`<div class="grid">${[['rec','Reconstruye Europa','Marca qué imperios desaparecen y qué Estados aparecen, con corrección inmediata.'],['cam','¿Qué cambió?','Compara 1914 y 1919: imperios, nuevos Estados, cambios territoriales y consecuencias políticas.'],['ord','Explica la guerra','Ordena diez hitos desde las causas hasta el nuevo mapa.'],['rep','Preguntas de repaso','Ocho preguntas con «Mostrar explicación».'],['fue','Fuentes y rigor','Referencias y notas sobre aproximaciones.']].map(a=>`<button class="card" data-s="${a[0]}"><h4>${a[1]}</h4><p>${a[2]}</p></button>`).join('')}<button class="card" id="g15"><h4>Glosario</h4><p>18 términos clave con definición contextualizada.</p></button></div>`;
 $$('.card[data-s]',c).forEach(b=>b.onclick=()=>{S.sub.t15=b.dataset.s;go('t15');});$('#g15').onclick=()=>glossModal();
}
function A_rec(c){
 const st=S.rc={hits:0,errs:0,done:{},ok:{}};
 const emp=['alemania','austria_hungria','rusia','otomano'];
 const nm=id=>STATES[id]?STATES[id].n:id;
 c.innerHTML=`<div class="callout"><b>Reconstruye Europa.</b> 1.º Pulsa en el mapa de 1914 los <b>imperios que desaparecen</b>. 2.º Elige los <b>Estados que aparecen o reaparecen</b>.</div><div class="layout"><div><div id="mrec"></div></div><aside><div class="panel"><h3>1. Imperios</h3><div id="fb1" class="fb small">Pulsa un territorio.</div><div class="sc" id="sc1"></div></div><div class="panel" style="margin-top:12px"><h3>2. Nuevos Estados</h3><div class="opt" id="opts">${RECON_NEW.map((r,i)=>`<button data-i="${i}">${r[0]}</button>`).join('')}</div><div id="fb2" class="fb small"></div></div><div class="panel" style="margin-top:12px"><button class="btn pri" id="fin">Ver resultado</button> <button class="btn" id="rst">Reiniciar</button><div id="res"></div></div></aside></div>`;
 const draw=()=>{$('#mrec').innerHTML=wrapMap(mapSVG({set:'s1914',fill:id=>st.ok[id]===1?'#7DB48A':st.ok[id]===0?'#E39A92':(POL[id]||COL.none),aria:'Mapa de 1914 para la actividad'}),{cap:'Pulsa un territorio'});enableMap($('#mrec'),{region:id=>{if(st.done[id]){return;}st.done[id]=1;const r=RECON_EMP[id];const good=r?r[1]:0;st.ok[id]=good;if(good)st.hits++;else st.errs++;$('#fb1').className='fb small '+(good?'ok':'no');$('#fb1').textContent=r?r[0]:'Incorrecto: '+nm(id)+' no desaparece como imperio tras la guerra.';$('#sc1').textContent='Imperios encontrados: '+emp.filter(e=>st.ok[e]===1).length+'/4';draw();}});};
 draw();$('#sc1').textContent='Imperios encontrados: 0/4';
 $$('#opts button',c).forEach(b=>b.onclick=()=>{const i=+b.dataset.i;if(b.dataset.d)return;b.dataset.d=1;const r=RECON_NEW[i];b.classList.add(r[1]?'ok':'no');if(r[1])st.hits++;else st.errs++;$('#fb2').className='fb small '+(r[1]?'ok':'no');$('#fb2').textContent=r[2];});
 $('#fin').onclick=()=>{const miss=[];emp.forEach(e=>{if(st.ok[e]!==1)miss.push(`El imperio «${nm(e)}» desaparece.`);});RECON_NEW.forEach((r,i)=>{if(r[1]&&!$$('#opts button',c)[i].dataset.d)miss.push(r[0]+': aparece o reaparece como Estado.');});const sc=Math.max(0,st.hits-st.errs);$('#res').innerHTML=`<div class="sc">Puntuación: ${sc}/13</div><p class="small">Aciertos: ${st.hits} · errores: ${st.errs}</p><h4>Principales errores y lo que falta</h4><ul class="small">${Object.keys(st.ok).filter(k=>st.ok[k]===0).map(k=>`<li>${RECON_EMP[k]?RECON_EMP[k][0]:nm(k)+' no desaparece como imperio.'}</li>`).join('')}${RECON_NEW.map((r,i)=>(!r[1]&&$$('#opts button',c)[i].dataset.d)?`<li>${r[2]}</li>`:'').join('')}${miss.map(m=>`<li>Te falta: ${m}</li>`).join('')}</ul>`;};
 $('#rst').onclick=()=>A_rec(c);
}
function A_cam(c){
 const W=WHATCH;const sel={imp:[],nuevos:[],terr:[],pol:[]};
 const blk=(k,title,items,n)=>`<div class="panel" style="margin-top:12px"><h4 style="margin-top:0">${title}</h4><div class="opt" data-k="${k}">${items.map((x,i)=>`<button data-i="${i}">${x}</button>`).join('')}</div><div class="small" id="f-${k}"></div></div>`;
 c.innerHTML=`<div class="callout"><b>¿Qué cambió?</b> Observa los dos mapas y responde.</div><div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(300px,1fr))"><div><div class="lbl">1914</div>${wrapMap(mapSVG({set:'s1914',fill:id=>POL[id]||COL.none,lb:LB,seas:false}),{zoom:false})}</div><div><div class="lbl">1919</div>${wrapMap(mapSVG({set:'s1919',fill:id=>NEWST[id]?NEWST[id].col:(POL[id]||COL.none),lb:LB,seas:false}),{zoom:false})}</div></div>${blk('imp','Identifica cuatro imperios desaparecidos',W.imp)}${blk('nuevos','Identifica cinco nuevos Estados',W.nuevos)}${blk('terr','Identifica tres cambios territoriales',W.terr)}${blk('pol','Identifica dos consecuencias políticas',W.pol)}<div class="panel" style="margin-top:12px"><button class="btn pri" id="chk">Comprobar</button> <button class="btn" id="rst">Reiniciar</button><div id="res2"></div></div>`;
 const cfg={imp:[W.impOk,4],nuevos:[W.nuevosOk,5],terr:[W.terrOk,3],pol:[W.polOk,2]};
 $$('.opt[data-k] button',c).forEach(b=>b.onclick=()=>{const k=b.parentElement.dataset.k,i=+b.dataset.i,a=sel[k],p=a.indexOf(i);if(p>=0)a.splice(p,1);else a.push(i);b.classList.toggle('sel',p<0);});
 $('#chk').onclick=()=>{let tot=0,max=0,msg='';Object.keys(sel).forEach(k=>{const [ok,n]=cfg[k];max+=n;const good=sel[k].filter(i=>ok.includes(i)).length,bad=sel[k].length-good;const sc=Math.max(0,Math.min(n,good)-bad);tot+=sc;$$(`.opt[data-k="${k}"] button`,c).forEach(b=>{const i=+b.dataset.i;b.classList.remove('sel');if(sel[k].includes(i))b.classList.add(ok.includes(i)?'ok':'no');});
  $('#f-'+k).textContent=`${sc}/${n} · Correctas: ${ok.map(i=>cfgItems(k)[i]).join('; ')}`;});
  $('#res2').innerHTML=`<div class="sc">Puntuación: ${tot}/${max}</div><p class="small">Selecciones incorrectas restan. Los cambios territoriales correctos son los de Alsacia-Lorena, Trentino-Trieste, Posnania y Transilvania (en 1919-1920).</p>`;};
 const cfgItems=k=>({imp:W.imp,nuevos:W.nuevos,terr:W.terr,pol:W.pol})[k];
 $('#rst').onclick=()=>A_cam(c);
}
function A_ord(c){
 const idx=ORDEN.map((_,i)=>i);let seed=7;const sh=idx.slice().sort((a,b)=>((a*37+seed)%11)-((b*37+seed)%11));
 let seq=[];
 const eq=(a,b)=>a===b||((a===5&&b===6)||(a===6&&b===5));
 function draw(){
  $('#bank').innerHTML=sh.filter(i=>!seq.includes(i)).map(i=>`<li><button data-b="${i}">${ORDEN[i][0]}</button></li>`).join('')||'<li class="small">Todos los hitos están colocados.</li>';
  $('#seq').innerHTML=seq.map((i,p)=>`<li><button data-s="${p}"><b>${p+1}.</b> ${ORDEN[i][0]}</button></li>`).join('')||'<li class="small">Pulsa los hitos en orden cronológico y causal.</li>';
  $$('#bank button').forEach(b=>b.onclick=()=>{seq.push(+b.dataset.b);draw();});
  $$('#seq button').forEach(b=>b.onclick=()=>{seq.splice(+b.dataset.s,1);draw();});
 }
 c.innerHTML=`<div class="callout"><b>Explica la guerra.</b> Ordena los diez hitos. Pulsa un hito colocado para retirarlo. (Salida de Rusia y entrada de EE. UU. se admiten en cualquier orden.)</div><div class="ord"><div><h4>Hitos</h4><ul id="bank" style="padding:0;margin:0"></ul></div><div><h4>Tu secuencia</h4><ol id="seq"></ol></div></div><div class="panel" style="margin-top:12px"><button class="btn pri" id="chk">Comprobar</button> <button class="btn" id="rst">Reiniciar</button><div id="res3"></div></div>`;
 draw();
 $('#chk').onclick=()=>{if(seq.length<ORDEN.length){$('#res3').innerHTML='<p class="fb no">Faltan hitos por colocar.</p>';return;}let ok=0;const err=[];seq.forEach((v,p)=>{if(eq(v,p))ok++;else err.push(`Posición ${p+1}: «${ORDEN[v][0]}» no va aquí. Debería ir «${ORDEN[p][0]}»: ${ORDEN[p][1]}`);});$('#res3').innerHTML=`<div class="sc">Puntuación: ${ok}/10</div>${err.length?`<h4>Principales errores</h4><ul class="small">${err.map(e=>`<li>${e}</li>`).join('')}</ul>`:'<p class="fb ok">Orden correcto: de las causas profundas al nuevo mapa y sus problemas.</p>'}`;};
 $('#rst').onclick=()=>{seq=[];$('#res3').innerHTML='';draw();};
}
function A_rep(c){c.innerHTML=`<h3>Preguntas de repaso</h3>${QUIZ.map(q=>qa(q[0],q[1])).join('')}`;wireCommon(c);}
function A_fue(c){c.innerHTML=`<h3>Fuentes y rigor histórico</h3>${SOURCES.map(s=>`<div class="card" style="margin-bottom:8px"><h4>${s[0]}</h4><p>${s[1]}</p></div>`).join('')}`;}
/* ===== Router, hilo causal, recorrido ===== */
const TABS=[['t1','Europa en 1914',T1],['t2','Los bandos',T2],['t3','El estallido',T3],['t4','La guerra año a año',T4],['t5','Los frentes',T5],['t6','Guerra total',T6],['t7','1917: el año decisivo',T7],['t8','1918: el colapso',T8],['t9','Los tratados de paz',T9],['t10','El nuevo mapa de Europa',T10],['t11','El nuevo mapa de Oriente Próximo',T11],['t12','Consecuencias',T12],['t13','Personajes',T13],['t14','Cronología',T14],['t15','Explora / Retos',T15]];
const HILO=[['Europa en tensión','t1'],['Crisis de 1914','t3'],['Guerra de movimientos','t4'],['Guerra de trincheras','t5'],['Guerra total','t6'],['1917','t7'],['1918','t8'],['1919-1923','t9'],['Consecuencias','t12']];
const HMAP={t1:0,t2:0,t3:1,t4:2,t5:3,t6:4,t7:5,t8:6,t9:7,t10:7,t11:7,t12:8};
function go(id){
 if(S.play){clearInterval(S.play);S.play=null;}
 S.tab=id;const t=TABS.find(x=>x[0]===id);
 $$('#nav button').forEach(b=>b.classList.toggle('on',b.dataset.t===id));
 $$('#hilo button').forEach((b,i)=>b.classList.toggle('on',HMAP[id]===i));
 const v=$('#view');v.innerHTML='';
 try{t[2](v);}catch(e){v.innerHTML='<div class="panel">Error al cargar la sección: '+esc(e.message)+'</div>';console.error(e);}
 wireCommon(v);
 const nb=$('#nav button.on');if(nb&&nb.scrollIntoView)nb.scrollIntoView({block:'nearest',inline:'center'});
}
const TOUR=[['t1','1914: una Europa de imperios y alianzas.'],['t3','Las causas profundas: nacionalismo, imperialismo, armamentos y alianzas (pulsa «¿Por qué estalló la guerra?»).'],['t3','El estallido: del atentado de Sarajevo a la guerra europea.'],['t5','Los frentes: occidental, oriental, balcánico, italiano y Oriente Próximo.'],['t6','Guerra total: economía, sociedad, tecnología, población y propaganda.'],['t7','1917: Rusia sale, Estados Unidos entra.'],['t8','1918: el colapso de las Potencias Centrales y el armisticio.'],['t9','Los tratados de paz: no solo Versalles.'],['t10','El nuevo mapa de Europa: imperios que desaparecen, Estados que nacen.'],['t12','Consecuencias: del nuevo orden a los nuevos problemas.']];
function tour(i){
 const bar=$('#tour');
 if(i==null||i<0||i>=TOUR.length){S.tour=null;bar.classList.remove('on');return;}
 S.tour=i;go(TOUR[i][0]);if(i===2){S.st3=0;}
 bar.innerHTML=`<b>Recorrido guiado ${i+1}/${TOUR.length}</b><div>${TOUR[i][1]}</div><div class="b"><button class="btn sm" id="tp" ${i===0?'disabled':''}>← Anterior</button><button class="btn sm" id="tn">${i===TOUR.length-1?'Terminar':'Siguiente →'}</button><button class="btn sm" id="tx">Salir</button></div>`;
 bar.classList.add('on');
 $('#tp').onclick=()=>tour(i-1);$('#tn').onclick=()=>tour(i===TOUR.length-1?null:i+1);$('#tx').onclick=()=>tour(null);
}
function init(){
 $('#nav').innerHTML=TABS.map((t,i)=>`<button data-t="${t[0]}"><span class="n">${i+1}</span>${t[1]}</button>`).join('');
 $('#hilo').innerHTML=HILO.map((h,i)=>`${i?'<span>›</span>':''}<button data-g="${h[1]}">${h[0]}</button>`).join('');
 $$('#nav button').forEach(b=>b.onclick=()=>{if(S.tour!=null)tour(null);go(b.dataset.t);});
 $$('#hilo button').forEach(b=>b.onclick=()=>go(b.dataset.g));
 $('#bgl').onclick=()=>glossModal();
 $('#bprof').onclick=e=>{S.prof=!S.prof;document.body.classList.toggle('prof',S.prof);e.currentTarget.classList.toggle('on',S.prof);};
 $('#btour').onclick=()=>tour(0);
 $('#bfue').onclick=()=>openModal('<h2>Fuentes y rigor histórico</h2>'+SOURCES.map(s=>`<h4>${s[0]}</h4><p>${s[1]}</p>`).join(''));
 $('#mod').onclick=e=>{if(e.target.id==='mod')closeModal();};
 go('t1');
}
document.addEventListener('DOMContentLoaded',init);

</script>
</body></html>

<style>:root{--W:#2b6cb0;--E:#c0392b;--N:#8a95a1;--Y:#f2c300;--O:#e8780c;--ink:#14202b;--mut:#4d5c69;--paper:#eef1f4;--panel:#fff;--line:#cdd6dd;--sea:#d3dee6;--land:#eceeee;--hh:66px;--fh:30px;--rail:172px;

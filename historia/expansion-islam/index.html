        const PER=[
        {y:632,c:'Md -- -- -- -- -- -- -- -- -- -- -- -- -- -- -- --',t:'Arabia y el Estado de Medina',x:'Arabia no era un vacío: rutas caravaneras unían Bizancio, Persia y Yemen; La Meca (Kaaba, tribu Quraysh) era nudo comercial y religioso, con comunidades judías y cristianas. Mahoma (c. 570-632), tras la Hégira (622), forma la umma en Medina y unifica gran parte de Arabia. Los datos proceden sobre todo de la tradición islámica; los historiadores debaten detalles.'},
        {y:661,c:'Rd Rd Rd Ri -- -- -- -- -- -- Rd Rd Ri -- -- -- --',t:'Califas ortodoxos (632-661)',x:'Abu Bakr (guerras de apostasía), Umar (Siria, Egipto, Persia), Uthman (códice coránico) y Ali. Bizancio y Persia, agotados por décadas de guerra, y un ejército móvil explican la rapidez. La Primera Fitna (656-661; Siffin, 657) abre las divisiones suní, chií y jariyí: procesos graduales, no un cisma inmediato.'},
        {y:750,c:'Od Od Od Od Od Od Od Od Od -- Od Od Od Od -- -- --',t:'Califato omeya (661-750)',x:'Muawiya funda la dinastía en Damasco. Abd al-Malik arabiza la administración y acuña moneda propia; al-Walid I alcanza la máxima extensión: Magreb, Hispania (711), Transoxiana y Sind. Los mawali (conversos no árabes) reclaman igualdad: una tensión que acaba en la revolución abasí (750). Poitiers (732) y Talas (751) fijan los límites.'},
        {y:900,c:'Ad Td Td gd Id ad ad ac ad gd Ad At Zd At -- -- --',t:'Abasíes y primeras fragmentaciones',x:'Los abasíes trasladan el poder a Irak; Bagdad (762) es capital de la Edad de Oro (Casa de la Sabiduría, traducciones del griego y del persa). Pero ya surgen poderes autónomos: omeyas de Córdoba (756), idrisíes, aglabíes, tuluníes, samaníes. El califa conserva prestigio religioso, no control efectivo.'},
        {y:1000,c:'Fi Fc Fd Ft Fi ad ad ad ad Ft Bd Bd Hc Hd -- -- --',t:'Tres califatos rivales',x:'Coexisten el califato abasí (Bagdad, bajo tutela búyida), el fatimí chií (El Cairo, 969) y el omeya de Córdoba (929), con Almanzor en su apogeo. Islam no equivale a un único Estado: hay una comunidad religiosa compartida y muchos poderes políticos. Ghaznavíes en Afganistán y el Indo.'},
        {y:1100,c:'Si Cc Fd Ft Ld Ld Xc td Ld Xd Sd Sd Sd Hd -- Sd --',t:'Selyúcidas, cruzadas y taifas',x:'Los turcos selyúcidas protegen al califa suní y vencen a Bizancio en Manzikert (1071). La Primera Cruzada (1099) crea estados latinos en el Levante. En al-Ándalus, tras el fin del califato (1031) surgen las taifas; Toledo cae en 1085 y los almorávides las unifican desde 1086.'},
        {y:1250,c:'Yi Yd md qd qc Xd Xd Xd Nd Xd Ad Kd Kd Ed Ed Kt --',t:'Ayyubíes, mamelucos y Reconquista',x:'Saladino (Hattin, 1187) crea el sultanato ayyubí; en 1250 los mamelucos toman Egipto. Los almohades se hunden tras Las Navas de Tolosa (1212); Castilla toma Córdoba (1236) y Sevilla (1248): solo resiste Granada (nazarí). El sultanato de Delhi domina el norte de la India.'},
        {y:1300,c:'mi md md qd qd Xd Xd Xd Nd Xd Kd Kd Kc Ed Ed Kt --',t:'Mongoles y nuevo centro de gravedad',x:'Hulagu toma Bagdad (1258) y acaba con el califato abasí de Bagdad. Los mamelucos detienen a los mongoles en Ayn Yalut (1260) y acogen a un califa simbólico en El Cairo. El ilkanato persa se islamiza. El poder pasa a El Cairo, Persia y Anatolia, donde nace el beylicato otomano (Osman I, c. 1299).'},
        {y:1453,c:'md md md qd qd Xd Xd Xd Nd Xd ic id id Ec Ec Ud Ud',t:'Ascenso otomano',x:'Los otomanos pasan a los Balcanes (Kosovo 1389, Nicópolis 1396). Mehmed II conquista Constantinopla el 29 de mayo de 1453 y la convierte en capital. Mientras, mamelucos en Oriente Próximo, timúridas en Persia, hafsíes y mariníes en el Magreb, nazaríes en Granada: pluralidad política.'},
        {y:1500,c:'md md md qd qd Xd Xd Xd Xd Xd ic Wc jd Ed Ed Ud Ud',t:'Tres imperios en formación',x:'Cae Granada (1492). Shah Ismail I funda el imperio safávida (1501) e impone el chiismo duodecimano; los otomanos, suníes, son su gran rival (Chaldiran, 1514). Selim I conquistará Siria y Egipto (1516-17); Babur funda el imperio mogol (1526).'},
        {y:1600,c:'Ud Ud Ud Ut sd Xd Xd Xd Xd Xd Uc Wd jd Gd Gd Ud Ud',t:'Apogeo otomano, safávida y mogol',x:'Solimán el Magnífico (1520-66): Belgrado, Mohács, primer cerco de Viena (1529) y dominio del Mediterráneo oriental; Lepanto (1571) frena el avance naval. Millets, jenízaros y fiscalidad sostienen un imperio plural. Akbar consolida el imperio mogol; Abbas I hace de Isfahán la capital safávida.'},
        {y:1700,c:'Ut Ud Ud Ut ld Xd Xd Xd Xd Xd Ud Wd jd Gd Gd Ud Ud',t:'Máxima extensión y primeros reveses',x:'El fracaso ante Viena (1683) y la paz de Karlowitz (1699) inician el retroceso otomano en Europa. Aurangzeb lleva el imperio mogol a su extensión máxima (c. 1707), seguida de su desintegración. Los safávidas caen en 1722. Marruecos alauí se mantiene independiente.'},
        {y:1800,c:'Ut Ud Uc Ut ld Xd Xd Xd Xd Xd Ud pd jd pc ec Ud Ud',t:'Crisis y expansión europea',x:'Napoleón invade Egipto (1798); la Compañía Británica de las Indias Orientales domina la India (el Mogol sobrevive nominalmente hasta 1857); Rusia avanza en el Cáucaso y Asia Central. Reformas otomanas (Selim III, Tanzimat de 1839), nacionalismos balcánicos y Egipto de Mehmed Alí.'},
        {y:1914,c:'Ud Ud ed ed ed Xd Xd Xd Xd Xd Ud pc ed ed ed Ud --',t:'Colonialismo y fin del imperio',x:'Francia: Argelia (1830), Túnez (1881), Marruecos (1912); Gran Bretaña: Egipto (1882), India; Italia: Libia (1911). El Imperio otomano entra en la Gran Guerra (1914). Sèvres (1920), Lausana (1923), abolición del sultanato (1922) y del califato (1924) por Mustafa Kemal: nacen los estados modernos.'}];

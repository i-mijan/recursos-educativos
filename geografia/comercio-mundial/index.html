<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Atlas interactivo del comercio mundial</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;600;700&family=Spectral:wght@500;600;700&display=swap">
<style>:root{
  --sea:#d5e3ec;--land:#eceee8;--land-s:#aab4b8;--ink:#10283c;--muted:#566877;--panel:#fbfcfc;--panel2:#f1f5f7;--line:#d2dbe1;
  --accent:#0d5a8c;--accent-ink:#fff;--sea-route:#1766a6;--land-route:#8a5a14;--geo:#b3261e;--warn:#9a5b00;
  --grat:#c4d3dd;--bar:#8aa0ae;--shadow:0 6px 24px rgba(16,40,60,.16);--focus:#e08a00;
  --f-head:"Spectral",Georgia,"Times New Roman",serif;--f-ui:"Public Sans","Segoe UI",system-ui,-apple-system,Arial,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --sea:#0c1b27;--land:#203240;--land-s:#385063;--ink:#e6eef3;--muted:#9bb0bf;--panel:#13222d;--panel2:#192b38;--line:#27404f;
  --accent:#5db1e6;--accent-ink:#06202f;--sea-route:#58a9e6;--land-route:#d9a24c;--geo:#ff7a70;--grat:#173042;--bar:#6f93aa;--shadow:0 6px 24px rgba(0,0,0,.5);--focus:#ffb347;}}
:root[data-theme="dark"]{
  --sea:#0c1b27;--land:#203240;--land-s:#385063;--ink:#e6eef3;--muted:#9bb0bf;--panel:#13222d;--panel2:#192b38;--line:#27404f;
  --accent:#5db1e6;--accent-ink:#06202f;--sea-route:#58a9e6;--land-route:#d9a24c;--geo:#ff7a70;--grat:#173042;--bar:#6f93aa;--shadow:0 6px 24px rgba(0,0,0,.5);--focus:#ffb347;}
*{box-sizing:border-box}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
body{margin:0;height:100%;background:var(--panel);color:var(--ink);font:14px/1.45 var(--f-ui);overflow:hidden}
h1,h2,h3{font-family:var(--f-head);margin:0;font-weight:600;letter-spacing:.005em}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px;border-radius:3px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
#app{display:grid;grid-template-rows:auto minmax(0,1fr);grid-template-columns:minmax(0,1fr);height:100%;width:100%}
header.top{display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px;min-width:0;padding:8px 14px;border-bottom:1px solid var(--line);background:var(--panel);z-index:5}
header.top h1{font-size:1.28rem;white-space:nowrap}
header.top .sub{color:var(--muted);font-size:.78rem;margin-left:2px}
.spacer{flex:1}
.btn{border:1px solid var(--line);background:var(--panel2);border-radius:6px;padding:6px 10px;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.ghost{background:transparent}
.search{position:relative;min-width:200px;max-width:340px;flex:1}
.search input{width:100%;padding:7px 10px;border:1px solid var(--line);border-radius:6px;background:var(--panel2)}
.results{position:absolute;left:0;right:0;top:100%;background:var(--panel);border:1px solid var(--line);border-radius:6px;box-shadow:var(--shadow);max-height:300px;overflow:auto;z-index:20;margin-top:4px}
.results button{display:flex;width:100%;gap:8px;border:0;background:transparent;text-align:left;padding:7px 10px;align-items:baseline}
.results button:hover,.results button[aria-selected="true"]{background:var(--panel2)}
.results small{color:var(--muted);margin-left:auto}
main{display:grid;grid-template-columns:300px minmax(0,1fr);min-height:0;position:relative}
aside.ctrl{border-right:1px solid var(--line);overflow:auto;background:var(--panel);padding:10px 12px 40px}
.ctrl details{border-bottom:1px solid var(--line);padding:6px 0}
.ctrl summary{cursor:pointer;font-weight:600;padding:5px 0;list-style:none;display:flex;justify-content:space-between}
.ctrl summary::-webkit-details-marker{display:none}
.ctrl summary::after{content:"+";color:var(--muted)}
.ctrl details[open] summary::after{content:"–"}
.row{display:flex;align-items:center;gap:8px;padding:3px 0}
.row label{flex:1;cursor:pointer}
.sw{width:22px;height:0;border-top:3px solid;display:inline-block;flex:none}
.dot{width:11px;height:11px;border-radius:50%;display:inline-block;flex:none}
.field{display:block;margin:7px 0 2px;font-size:.78rem;color:var(--muted)}
.ctrl select{width:100%;padding:6px;border:1px solid var(--line);border-radius:6px;background:var(--panel2)}
.seg{display:flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{flex:1;border:0;background:var(--panel2);padding:5px 4px;font-size:.8rem}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.note{font-size:.76rem;color:var(--muted);margin:4px 0}
.note.warn{color:var(--warn)}
.q{display:block;width:100%;text-align:left;border:1px solid var(--line);background:var(--panel2);border-radius:6px;padding:7px 9px;margin:5px 0}
.q:hover{border-color:var(--accent)}
.mapwrap{position:relative;background:var(--sea);min-width:0;min-height:0;overflow:hidden}
svg#map{width:100%;height:100%;display:block;touch-action:none;cursor:grab}
svg#map:active{cursor:grabbing}
.sea{fill:var(--sea)}.grat{fill:none;stroke:var(--grat);stroke-width:.5}
.country{fill:var(--land);stroke:var(--land-s);stroke-width:.4;vector-effect:non-scaling-stroke}
.country.data{cursor:pointer}
.country.data:hover,.country.sel{stroke:var(--ink);stroke-width:1.4}
.country.dim{opacity:.25}
.hit{fill:none;stroke:transparent;stroke-width:12;vector-effect:non-scaling-stroke;cursor:pointer;pointer-events:stroke}
.line{fill:none;vector-effect:non-scaling-stroke;stroke-linecap:round;stroke-linejoin:round;pointer-events:none}
.item.dim{opacity:.1}.item.dim *{pointer-events:none}
.item.sel .line{filter:drop-shadow(0 0 3px var(--focus));stroke-width:5px}
.mk{cursor:pointer}
.mk circle,.mk rect,.mk path{stroke:var(--panel);stroke-width:1.5}
.mk.sel circle,.mk.sel rect,.mk.sel path{stroke:var(--focus);stroke-width:3}
.mk.nodata circle{fill:transparent;stroke:var(--muted);stroke-dasharray:2 2}
.lbl{font-size:10px;fill:var(--ink);paint-order:stroke;stroke:var(--sea);stroke-width:3px;pointer-events:none;font-weight:600}
.zoomb{position:absolute;right:12px;top:12px;display:flex;flex-direction:column;gap:4px}
.zoomb button{width:34px;height:34px;border-radius:6px;border:1px solid var(--line);background:var(--panel);font-size:1.1rem}
.legend{position:absolute;left:12px;bottom:12px;max-width:250px;background:var(--panel);border:1px solid var(--line);border-radius:8px;box-shadow:var(--shadow);font-size:.78rem;max-height:34%;overflow:auto}
.legend>button{width:100%;text-align:left;border:0;background:transparent;font-weight:600;padding:6px 10px;display:flex;justify-content:space-between}
.legend .lg{padding:0 10px 8px}
.legend .row{padding:2px 0;font-size:.76rem}
.grad{height:8px;border-radius:4px;margin:4px 0 2px}
.tt{position:absolute;pointer-events:none;background:var(--ink);color:var(--panel);padding:4px 8px;border-radius:5px;font-size:.78rem;z-index:8;max-width:260px;opacity:0;transition:opacity .08s}
.banner{position:absolute;left:50%;transform:translateX(-50%);top:10px;background:var(--panel);border:1px solid var(--warn);color:var(--warn);padding:5px 10px;border-radius:6px;font-size:.78rem;box-shadow:var(--shadow);max-width:60%;display:none;z-index:4}
/* panel */
#panel{position:absolute;top:0;right:0;bottom:0;width:390px;max-width:100%;background:var(--panel);border-left:1px solid var(--line);box-shadow:var(--shadow);overflow:auto;transform:translateX(105%);transition:transform .22s;z-index:6}
#panel.open{transform:none}
#panel .ph{position:sticky;top:0;background:var(--panel);padding:12px 14px 8px;border-bottom:1px solid var(--line);z-index:2;display:flex;gap:8px;align-items:flex-start}
#panel .ph h2{font-size:1.25rem;flex:1;line-height:1.2}
#panel .ph .x{border:1px solid var(--line);background:var(--panel2);border-radius:6px;width:30px;height:30px}
.pb{padding:10px 14px 28px}
.kind{font-size:.74rem;color:var(--muted);margin-bottom:2px}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0}
.kpi{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:8px 9px}
.kpi b{display:block;font-family:var(--f-head);font-size:1.18rem;line-height:1.15}
.kpi span{font-size:.74rem;color:var(--muted)}
.pb p{margin:6px 0;max-width:62ch}
.pb details{border:1px solid var(--line);border-radius:8px;margin:8px 0;background:var(--panel)}
.pb details>summary{cursor:pointer;padding:8px 10px;font-weight:600;list-style:none;display:flex;justify-content:space-between}
.pb details>summary::-webkit-details-marker{display:none}
.pb details>summary::after{content:"+";color:var(--muted)}
.pb details[open]>summary::after{content:"–"}
.pb details>div{padding:0 10px 10px}
.fig{margin:10px 0;padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--panel)}
.fig h4{margin:0 0 4px;font:600 .86rem var(--f-ui)}
.fig svg{width:100%;height:auto;display:block}
.fig .cap{font-size:.72rem;color:var(--muted);margin-top:3px}
.fig .cap a{color:var(--accent)}
.chip{display:inline-block;font-size:.7rem;padding:1px 7px;border-radius:99px;border:1px solid var(--line);margin-right:5px;white-space:nowrap}
.chip.hecho{background:#e1f1ea;color:#1c5e46;border-color:#b7dcc9}
.chip.inter{background:#e7edf8;color:#34508f;border-color:#c5d3ee}
.chip.esc{background:#fdeed7;color:#8a5200;border-color:#f1d2a1}
.chip.ver{background:#e1f1ea;color:#1c5e46}.chip.ref{background:#eef0f2;color:#445}.chip.est{background:#fdeed7;color:#8a5200}
:root[data-theme="dark"] .chip.hecho,:root[data-theme="dark"] .chip.inter,:root[data-theme="dark"] .chip.esc{filter:brightness(.8) saturate(.9)}
.item2{padding:6px 0;border-top:1px solid var(--line)}.item2:first-child{border-top:0}
table.t{width:100%;border-collapse:collapse;font-size:.78rem;margin:6px 0}
table.t th,table.t td{border-bottom:1px solid var(--line);padding:4px 5px;text-align:left;vertical-align:top}
table.t th{background:var(--panel2)}
.tab-wrap{overflow-x:auto}
.src li{margin:3px 0}.src a{color:var(--accent)}
.lk{border:0;background:none;color:var(--accent);padding:0;text-decoration:underline;cursor:pointer}
.mini{border:1px solid var(--line);border-radius:8px;background:var(--sea);margin:8px 0}
.mini svg{display:block;width:100%;height:auto}
/* modal */
.modal{position:fixed;inset:0;background:rgba(5,15,25,.55);display:none;align-items:flex-start;justify-content:center;z-index:30;padding:5vh 12px;overflow:auto}
.modal.open{display:flex}
.modal .box{background:var(--panel);border-radius:10px;max-width:820px;width:100%;box-shadow:var(--shadow);padding:16px 18px 24px}
.modal .mh{display:flex;gap:10px;align-items:center;margin-bottom:8px}
.modal .mh h2{flex:1}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.chips label{border:1px solid var(--line);border-radius:99px;padding:3px 10px;cursor:pointer;background:var(--panel2);font-size:.8rem}
.chips input{margin-right:4px}
#mobbtn{display:none}
@media (max-width:860px){
  main{grid-template-columns:minmax(0,1fr)}
  header.top{padding:6px 10px}
  header.top h1{font-size:1.05rem;white-space:normal}
  .search{order:5;flex:1 1 100%;max-width:none}
  .spacer{display:none}
  header.top .btn{padding:4px 7px;font-size:.74rem}
  header.top{gap:6px}
  .mapwrap.pop svg#map{height:42%}
  .mapwrap.pop .zoomb{top:8px}
  .mapwrap.pop .legend{display:none}
  .pb{min-width:0}
  aside.ctrl{position:absolute;inset:0 18% 0 0;z-index:9;transform:translateX(-105%);transition:transform .2s;box-shadow:var(--shadow)}
  aside.ctrl.open{transform:none}
  #mobbtn{display:inline-block}
  #panel{top:auto;left:0;width:100%;height:58%;border-left:0;border-top:1px solid var(--line);transform:translateY(105%)}
  #panel.open{transform:none}
  header.top .sub{display:none}
  .legend{max-width:200px;max-height:30%;bottom:12px}
  .banner{max-width:86%}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

.chips .chip{padding:5px 10px;border-radius:6px;background:transparent;font-size:.84rem;color:var(--muted)}
</style>
</head>

<div id="app">
 <header class="top">
  <button id="mobbtn" class="btn" aria-label="Mostrar capas y filtros">☰ Capas</button>
  <div><h1>Atlas del comercio mundial</h1><span class="sub">Datos a 10 oct. 2026 · Realizado por Ismael Miján</span></div>
  <div class="search"><label class="sr" for="q">Buscar país, puerto, estrecho, canal o corredor</label>
   <input id="q" type="search" placeholder="Buscar país, puerto, estrecho…" autocomplete="off" aria-controls="results">
   <div id="results" class="results" role="listbox" hidden></div></div>
  <span class="spacer"></span>
  <button id="bCompare" class="btn">Comparar</button>
  <button id="bReset" class="btn">Restablecer</button>
  <button id="bMeth" class="btn pri">Fuentes y metodología</button>
  <button id="bTheme" class="btn" aria-label="Cambiar entre tema claro y oscuro">◐</button>
 </header>
 <main>
  <aside class="ctrl" id="ctrl" aria-label="Capas y filtros"></aside>
  <div class="mapwrap">
   <svg id="map" role="group" aria-label="Mapa mundial interactivo del comercio"></svg>
   <div class="zoomb"><button id="zin" aria-label="Acercar">+</button><button id="zout" aria-label="Alejar">−</button><button id="zrst" aria-label="Vista inicial">⌂</button></div>
   <div class="banner" id="banner" role="status"></div>
   <div class="legend" id="legend"><button id="lgb" aria-expanded="true">Leyenda y unidades <span>▾</span></button><div class="lg"></div></div>
   <aside id="panel" aria-label="Ficha informativa"></aside>
  </div>
 </main>
</div>
<div class="modal" id="modal" role="dialog" aria-modal="true"><div class="box" id="mbox"></div></div>

function donut(el,rows,o={}){const col=o.cols||['var(--accent)','var(--land-route)','#6d7ab5','#2a7f62','#b8483b','var(--land-s)'];const tot=d3.sum(rows,r=>r.v);
  const wrap=h('div',{style:'display:flex;gap:12px;align-items:center'});el.append(wrap);const box=h('div',{style:'width:120px;flex:none'});wrap.append(box);
  const s=d3.select(box).append('svg').attr('viewBox','0 0 120 120').attr('role','img').attr('aria-label',o.aria||'Gráfico de composición');
  const arcs=d3.pie().value(r=>r.v).sort(null)(rows);const ar=d3.arc().innerRadius(34).outerRadius(56);
  s.append('g').attr('transform','translate(60,60)').selectAll('path').data(arcs).join('path').attr('d',ar).style('fill',(d,i)=>col[i%col.length]).style('stroke','var(--panel)');
  const lg=h('div',{style:'font-size:.76rem;flex:1'});wrap.append(lg);rows.forEach((r,i)=>lg.append(h('div',{class:'row'},h('span',{class:'dot',style:`background:${col[i%col.length]}`}),h('span',null,`${r.l}: ${fmt(r.v,o.d||0)}${o.u||''} (${fmt(r.v/tot*100,0)} %)`))));}
function srcList(keys){if(!keys||!keys.length)return null;const ul=h('ul',{class:'src'});keys.forEach(k=>{const x=SRC[k];if(!x)return;ul.append(h('li',null,x.u&&x.u!=='#'?h('a',{href:x.u,target:'_blank',rel:'noopener'},x.n):x.n));});return ul;}
function taggedItems(items){const d=h('div');items.filter(i=>i.t).forEach(i=>d.append(h('div',{class:'item2'},h('span',{class:'chip '+i.k},TAGS[i.k]),i.t)));return d;}
function kpis(arr){return h('div',{class:'kpis'},arr.map(k=>h('div',{class:'kpi'},h('b',null,k.v),h('span',null,k.l))));}
function det(title,body,open){const d=h('details',{open:open||null},h('summary',null,title),h('div',null,body));return d;}
function miniMap(lat,lon,sc=700){const w=340,hh=170;const p=d3.geoMercator().center([lon,lat]).scale(sc).translate([w/2,hh/2]);const pa=d3.geoPath(p);
  const box=h('div',{class:'mini'});const s=d3.select(box).append('svg').attr('viewBox',`0 0 ${w} ${hh}`).attr('role','img').attr('aria-label','Mapa de situación');
  s.append('g').selectAll('path').data(feats).join('path').attr('d',pa).style('fill','var(--land)').style('stroke','var(--land-s)').style('stroke-width',.5);
  const c=p([lon,lat]);s.append('circle').attr('cx',c[0]).attr('cy',c[1]).attr('r',6).style('fill','none').style('stroke','var(--geo)').style('stroke-width',2.5);s.append('circle').attr('cx',c[0]).attr('cy',c[1]).attr('r',2.2).style('fill','var(--geo)');return box;}

const panel=$('#panel');

function countryPanel(c){
  const gdp=c.gdp*1000,tr=(c.exp+c.imp)/gdp*100,bal=c.exp-c.imp;
  const body=[h('p',null,c.role),
   kpis([{v:fmt(c.exp)+' mm US$',l:'Exportaciones de bienes, 2025'},{v:fmt(c.imp)+' mm US$',l:'Importaciones de bienes, 2025'},{v:(bal>=0?'+':'')+fmt(bal)+' mm US$',l:'Saldo comercial de mercancías, 2025'},{v:fmt(tr,0)+' %',l:'Comercio de bienes / PIB, 2025 (método abajo)'}]),
   h('div',{class:'row'},cmpBtn('countries',c.id))];
  const g2=[];
  g2.push(figure('Exportaciones e importaciones de bienes, 2025',el=>barChart(el,[{l:'Exportaciones',v:c.exp,hl:1},{l:'Importaciones',v:c.imp,c:'var(--land-route)'}],{lh:100}),{u:'miles de millones de US$',y:2025,s:['wto'],q:'ver'}));
  if(c.series)g2.push(figure('Evolución del comercio de bienes',el=>lineChart(el,[{name:'Exportaciones',pts:c.series.y.map((y,i)=>({x:String(y),y:c.series.e[i]}))},{name:'Importaciones',pts:c.series.y.map((y,i)=>({x:String(y),y:c.series.i[i]}))}]),{u:'miles de millones de US$',y:'2019, 2021, 2023, 2025',s:['wto'],q:'ref',note:'2025 verificado (OMC, mar. 2026); años anteriores redondeados. No se incluyen otros años.'}));
  else g2.push(h('p',{class:'note'},'Serie temporal: no incluida para este país en esta versión (solo el dato verificado de 2025).'));
  if(c.partners)g2.push(figure('Principales destinos de exportación',el=>barChart(el,c.partners.map(p=>({l:p.n+(p.bloc?' (bloque)':''),v:p.v})),{f:v=>v+' %',max:Math.max(20,d3.max(c.partners,p=>p.v))}),{u:'% de las exportaciones de bienes',y:'≈ 2023-24',s:['comtrade','wto'],q:'ref',note:'Cuotas redondeadas; ASEAN y UE son bloques, no países.'}));
  else g2.push(h('p',{class:'note'},c.partnersNote||'Socios comerciales: no incluidos para este país.'));
  if(c.cats)g2.push(figure('Composición de las exportaciones',el=>donut(el,c.cats.map(p=>({l:p.n,v:p.v})),{u:' %'}),{u:'% de las exportaciones de bienes (grupos OMC)',y:'≈',s:['wto'],q:'est',note:'Orden de magnitud, redondeado a múltiplos de 5.'}));
  else g2.push(h('p',{class:'note'},'Composición de las exportaciones: no incluida para este país.'));
  body.push(det('Gráficos y comparaciones',g2,true));
  const ctx=h('div');ctx.append(h('p',null,h('b',null,'Cadenas globales de valor: '),c.role),h('p',null,h('b',null,'Dependencias estratégicas: '),c.deps));
  c.facts.forEach(f=>ctx.append(h('p',null,'• '+f)));
  ctx.append(h('p',{class:'note'},`PIB nominal 2025: ${fmt(c.gdp,2)} billones US$ (FMI, estimación, oct. 2025) · Población ≈ ${fmt(c.pop)} M (2024). Comercio/PIB = (exportaciones + importaciones de bienes) / PIB nominal. Puede superar el 100 % porque el comercio se mide en valor bruto (con insumos importados y reexportaciones) y el PIB en valor añadido; no es "peso de las exportaciones en la economía".`));
  ctx.append(srcList(['wto','imf','wb','comtrade']));
  body.push(det('Contexto, dependencias y fuentes',ctx));
  openPanel(`País · ${flag(c.iso)}`,c.n,body);}

function portPanel(p){

  const body=[h('p',null,p.role),kpis([{v:v==null?'sin dato':fmt(v,2)+' M TEU',l:`Contenedores, ${S.portYear}`},{v:p.c,l:'País'}]),

  g2.push(figure('Trenes China–Europa por año',el=>lineChart(el,[{pts:BRI_RAIL_TRAINS.pts.map(p=>({x:p.x,y:p.y}))}]),{u:BRI_RAIL_TRAINS.u,y:'2016-2024',s:['crct'],q:'ref',note:BRI_RAIL_TRAINS.ver}));

function mval(c){const yr=S.year;let e,i;if(yr===2025){e=c.exp;i=c.imp;}else{if(!c.series)return null;const ix=c.series.y.indexOf(yr);if(ix<0)return null;e=c.series.e[ix];i=c.series.i[ix];}
  switch(S.metric){case'exp':return e;case'imp':return i;case'bal':return e-i;case'int':return yr===2025?(e+i)/(c.gdp*1000)*100:null;}}
let scale=null,legendKind='';
function buildScale(){const vals=COUNTRIES.map(mval).filter(v=>v!=null);const mx=d3.max(vals.map(Math.abs))||1;
  if(S.metric==='bal')scale=d3.scaleDivergingSqrt(t=>d3.interpolateRgbBasis(['#d46a1f','#f1ede6','#1766a6'])(t)).domain([-mx,0,mx]);
  else if(S.metric==='exp')scale=d3.scaleSequentialSqrt(d3.interpolateBlues).domain([0,mx]);
  else if(S.metric==='imp')scale=d3.scaleSequentialSqrt(d3.interpolateOranges).domain([0,mx]);
  else scale=d3.scaleSequential(d3.interpolatePurples).domain([0,mx]);scale.mx=mx;}
const CE='#2a7f62',CI='#d46a1f',CB='#6d4aa3';
function fillFor(d){
  if(S.comm){const c=COMM.find(x=>x.id===S.comm);const e=c.exp.includes(d.id),i=c.imp.includes(d.id);const ex=e&&S.side!=='imp',im=i&&S.side!=='exp';if(ex&&im)return CB;if(ex)return CE;if(im)return CI;return null;}
  if(S.layers.countries){const c=dataC[d.id];if(c){const v=mval(c);if(v!=null)return scale(v);}}return null;}

const IDX=[];
COUNTRIES.forEach(c=>IDX.push({t:'country',id:c.id,n:c.n,k:'País'}));PORTS.forEach(p=>IDX.push({t:'port',id:p.id,n:p.n,k:'Puerto'}));NODES.forEach(n=>IDX.push({t:'node',id:n.id,n:n.n,k:n.t==='canal'?'Canal':'Estrecho/paso'}));
ROUTES.forEach(r=>IDX.push({t:'route',id:r.id,n:r.n,k:'Ruta marítima'}));LAND.forEach(c=>IDX.push({t:'land',id:c.id,n:c.n,k:'Corredor terrestre'}));BRI_CORR.forEach(c=>IDX.push({t:'bricorr',id:c.id,n:c.n,k:'BRI'}));BRI_NODES.forEach(c=>IDX.push({t:'brinode',id:c.id,n:c.n,k:'BRI'}));COMM.forEach(c=>IDX.push({t:'comm',id:c.id,n:c.n,k:'Mercancía'}));
feats.forEach(f=>{if(!dataC[f.id])IDX.push({t:'country',id:f.id,n:ESN[f.id]||f.properties.name,k:'País (sin ficha)'});});
let resIdx=-1;const si=$('#q'),sr=$('#results');
function doSearch(){const q=norm(si.value.trim());sr.innerHTML='';resIdx=-1;if(q.length<2){sr.hidden=true;return;}
  const m=IDX.filter(i=>norm(i.n).includes(q)).slice(0,10);sr.hidden=!m.length;
  if(!m.length){sr.hidden=false;sr.append(h('div',{style:'padding:8px 10px;color:var(--muted)'},'Sin resultados. Prueba con país, puerto, estrecho o ruta.'));return;}
  m.forEach(i=>sr.append(h('button',{role:'option',type:'button',onclick:()=>{select(i.t,i.id);sr.hidden=true;si.value=i.n;}},i.n,h('small',null,i.k))));}
si.addEventListener('input',doSearch);
si.addEventListener('keydown',e=>{const bs=[...sr.querySelectorAll('button')];if(e.key==='ArrowDown'){e.preventDefault();resIdx=Math.min(bs.length-1,resIdx+1);}else if(e.key==='ArrowUp'){e.preventDefault();resIdx=Math.max(0,resIdx-1);}else if(e.key==='Enter'&&bs.length){e.preventDefault();(bs[Math.max(0,resIdx)]).click();return;}else if(e.key==='Escape'){sr.hidden=true;return;}else return;bs.forEach((b,i)=>b.setAttribute('aria-selected',i===resIdx));});
document.addEventListener('click',e=>{if(!e.target.closest('.search'))sr.hidden=true;});

/* ---------- Comparación ---------- */
const modal=$('#modal'),mbox=$('#mbox');
function closeModal(){modal.classList.remove('open');}
function openModal(title,content){mbox.innerHTML='';mbox.append(h('div',{class:'mh'},h('h2',null,title),h('button',{class:'btn',onclick:closeModal},'Cerrar')),content);modal.classList.add('open');}
function openCompare(kind='countries'){
  const wrap=h('div');const tabs=h('div',{class:'seg',role:'group'});[['countries','Países'],['ports','Puertos'],['routes','Rutas y corredores']].forEach(([k,t])=>tabs.append(h('button',{'aria-pressed':kind===k,onclick:()=>openCompare(k)},t)));wrap.append(tabs);
  const list=kind==='countries'?COUNTRIES.map(c=>({id:c.id,n:c.n})):kind==='ports'?PORTS.map(p=>({id:p.id,n:p.n})):[...ROUTES.map(r=>({id:'r:'+r.id,n:r.n})),...LAND.map(r=>({id:'l:'+r.id,n:r.n})),...BRI_CORR.map(r=>({id:'b:'+r.id,n:r.n+' (BRI)'}))];
  const chosen=cmpSel[kind];wrap.append(h('p',{class:'note'},'Elige hasta 4 elementos.'));
  const chips=h('div',{class:'chips'});list.forEach(i=>{const inp=h('input',{type:'checkbox'});inp.checked=chosen.includes(i.id);inp.onchange=()=>{const ix=chosen.indexOf(i.id);if(inp.checked&&ix<0)chosen.push(i.id);if(!inp.checked&&ix>=0)chosen.splice(ix,1);if(chosen.length>4)chosen.shift();openCompare(kind);};chips.append(h('label',null,inp,i.n));});wrap.append(chips);
  const out=h('div');wrap.append(out);
  if(chosen.length<2)out.append(h('p',{class:'note'},'Selecciona al menos dos elementos para compararlos.'));
  else if(kind==='countries'){const cs=chosen.map(id=>dataC[id]);
    out.append(figure('Exportaciones e importaciones de bienes, 2025',el=>{const rows=[];cs.forEach(c=>{rows.push({l:c.n+' · exportaciones',v:c.exp,hl:1});rows.push({l:c.n+' · importaciones',v:c.imp,c:'var(--land-route)'});});barChart(el,rows,{lh:170});},{u:'miles de millones de US$',y:2025,s:['wto'],q:'ver'}));
    out.append(figure('Comercio de bienes / PIB, 2025',el=>barChart(el,cs.map(c=>({l:c.n,v:(c.exp+c.imp)/(c.gdp*1000)*100})),{f:v=>fmt(v,0)+' %'}),{u:'% = (X+M de bienes)/PIB nominal',y:2025,s:['wto','imf'],q:'ver',note:'Puede superar 100 %: comercio en valor bruto frente a PIB en valor añadido.'}));
    out.append(h('div',{class:'tab-wrap'},h('table',{class:'t'},h('tr',null,['País','Saldo (mm US$)','Primer cliente','Dependencia estratégica'].map(x=>h('th',null,x))),...cs.map(c=>{const top=c.partners?c.partners.filter(p=>!p.bloc).sort((a,b)=>b.v-a.v)[0]:null;return h('tr',null,h('td',null,c.n),h('td',null,fmt(c.exp-c.imp)),h('td',null,top?`${top.n} (${top.v} %)`:'sin dato'),h('td',null,c.deps));}))));}
  else if(kind==='ports'){const ps=chosen.map(id=>PORTS.find(p=>p.id===id));out.append(figure(`Contenedores, ${S.portYear}`,el=>barChart(el,ps.map(p=>({l:p.n,v:p.teu[S.portYear]})),{d:1,lh:150}),{u:'millones de TEU',y:S.portYear,s:['joc','cn','nynj','santos'],q:'ver',note:'Los puertos sin cifra aparecen como "sin dato". No se comparan TEU con toneladas.'}));
    out.append(h('div',{class:'tab-wrap'},h('table',{class:'t'},h('tr',null,['Puerto','País','Función'].map(x=>h('th',null,x))),...ps.map(p=>h('tr',null,h('td',null,p.n),h('td',null,p.c),h('td',null,p.role))))));}
  else{const rs=chosen.map(id=>{const t=id[0],k=id.slice(2);return t==='r'?{n:ROUTES.find(x=>x.id===k).n,tipo:'Marítima',st:routeKind[ROUTES.find(x=>x.id===k).st],m:ROUTES.find(x=>x.id===k).merc,r:ROUTES.find(x=>x.id===k).riesgo}:t==='l'?{n:LAND.find(x=>x.id===k).n,tipo:'Terrestre',st:LAND.find(x=>x.id===k).segs.map(s=>ST[s.st].n).join(' / '),m:LAND.find(x=>x.id===k).merc,r:LAND.find(x=>x.id===k).riesgo}:{n:BRI_CORR.find(x=>x.id===k).n,tipo:'BRI terrestre',st:BRI_CORR.find(x=>x.id===k).segs.map(s=>ST[s.st].n).join(' / '),m:'—',r:BRI_CORR.find(x=>x.id===k).desc};});
    out.append(h('div',{class:'tab-wrap'},h('table',{class:'t'},h('tr',null,['Elemento','Tipo','Estado','Mercancías','Riesgos / notas'].map(x=>h('th',null,x))),...rs.map(r=>h('tr',null,h('td',null,r.n),h('td',null,r.tipo),h('td',null,r.st),h('td',null,r.m),h('td',null,r.r))))),h('p',{class:'note'},'Comparación cualitativa: no hay volúmenes homogéneos entre rutas.'));}
  openModal('Comparar',wrap);}

/* ---------- Metodología ---------- */
function openMeth(){
  const d=h('div');const P=t=>d.append(h('p',null,t));
  P('Atlas del comercio mundial · Realizado por Ismael Miján · datos a 10 de octubre de 2026. Está pensado para el aula de Geografía e Historia, pero con cifras y fuentes citadas. Prioriza lo verificable sobre lo espectacular.');
  d.append(h('h3',null,'Cómo explorar'));P('Primer nivel: cifras y descripción en la ficha. Segundo nivel: gráficos y comparaciones (desplegable abierto). Tercer nivel: explicaciones ampliadas, geopolítica y fuentes (desplegable). El mapa se maneja con rueda, arrastre, pellizco o los botones de zoom; todos los elementos se pueden alcanzar con el teclado (Tab, Intro o Espacio).');
  d.append(h('h3',null,'Calidad de los datos'));
  d.append(h('p',null,h('span',{class:'chip ver'},'verificado'),' cifra contrastada en una fuente consultada en esta versión; ',h('span',{class:'chip ref'},'referencia redondeada'),' cifra de orden de magnitud procedente de fuentes oficiales o conocidas, sin verificar de nuevo; ',h('span',{class:'chip est'},'estimación'),' valor aproximado. Si no hay dato, se indica ("sin dato" o "no incluido") y no se rellena.'));
  d.append(h('h3',null,'Advertencias estadísticas'));
  ['Las cifras comerciales varían según el país declarante, la valoración FOB/CIF, el tratamiento de las reexportaciones (muy relevantes en Países Bajos o Hong Kong) y la clasificación de productos.','Comercio ≠ PIB: el comercio de bienes se mide en valor bruto y el PIB en valor añadido; por eso (X+M)/PIB puede superar 100 %. Las exportaciones brutas no son valor añadido nacional.','TEU, toneladas y dólares son magnitudes distintas: Ningbo-Zhoushan lidera por toneladas totales y Shanghái por TEU.','Producción, exportación, procesamiento y control de la cadena son cosas diferentes: extraer un mineral no equivale a dominar su refinado.','Las rutas marítimas son corredores esquemáticos. El grosor expresa importancia cualitativa, no un volumen medido.','Se distinguen hechos comprobados, interpretaciones y escenarios hipotéticos (etiquetas en las fichas de geopolítica y de los pasos marítimos).'].forEach(t=>d.append(h('p',null,'• '+t)));
  d.append(h('h3',null,'Estado de cada función'));
  d.append(h('div',{class:'tab-wrap'},h('table',{class:'t'},h('tr',null,['Función','Estado'].map(x=>h('th',null,x))),...[['Mapa, zoom, capas, leyenda dinámica, fichas, búsqueda, comparador, teclado','Completo'],['Filtros de región, mercancía, modo, indicador y año','Completo; el año solo aplica a datos disponibles'],['Cifras de países (2025), puertos (2024-25), pasos marítimos, minerales, BRI','Datos reales; algunos de referencia redondeada o con fuentes secundarias (ver gráfico)'],['Series de 2019-2023 de cinco países, cuotas de socios y composición exportadora','Datos de referencia redondeados (≈), a verificar en UN Comtrade o la OMC'],['Transporte aéreo, participación por país en la BRI, series temporales largas','No incluido en esta versión'],['Actualización en tiempo real','No: datos estáticos; el estado de Ormuz, Suez o los aranceles puede haber cambiado'],['Servicios externos','Solo bibliotecas D3 y TopoJSON (CDN) y fuentes de Google; sin claves ni cuentas']].map(r=>h('tr',null,r.map(x=>h('td',null,x)))))));
  d.append(h('h3',null,'Cómo ejecutarlo'));P('Es un único archivo HTML: ábrelo en un navegador moderno con conexión a internet (carga D3 y TopoJSON desde un CDN y las tipografías de Google Fonts; si fallan, usa tipos del sistema). El mapa no usa teselas ni servicios cartográficos externos: la geometría (Natural Earth, vía world-atlas, dominio público) va incrustada. Para uso sin conexión, descarga d3@7.9.0 y topojson-client@3.1.0 y cámbialos por scripts locales.');
  d.append(h('h3',null,'Fuentes principales'));const ul=h('ul',{class:'src'});Object.keys(SRC).filter(k=>SRC[k].u!=='#').forEach(k=>ul.append(h('li',null,h('a',{href:SRC[k].u,target:'_blank',rel:'noopener'},SRC[k].n))));d.append(ul);
  P('Los enlaces son a las páginas de las fuentes; no se han comprobado automáticamente desde esta aplicación. Geometría: Natural Earth / world-atlas (escala 1:110 m); las fronteras son una simplificación y no expresan posición política.');
  openModal('Fuentes y metodología',d);}

/* ---------- Eventos ---------- */
cSel.on('click',(e,d)=>{if(dataC[d.id])select('country',d.id);}).on('keydown',(e,d)=>{if(dataC[d.id]&&(e.key==='Enter'||e.key===' ')){e.preventDefault();select('country',d.id);}})
  .on('mouseenter mousemove',(e,d)=>showTT(e,(ESN[d.id]||d.properties.name)+(dataC[d.id]?'':' · sin ficha'))).on('mouseleave',hideTT);
$('#bCompare').onclick=()=>openCompare('countries');$('#bMeth').onclick=openMeth;
$('#bReset').onclick=()=>{S=DEF();cmpSel.countries=[];cmpSel.ports=[];cmpSel.routes=[];closePanel();syncCtrl();resetView();update();};
$('#bTheme').onclick=()=>{const r=document.documentElement;const dark=r.dataset.theme?r.dataset.theme==='dark':window.matchMedia('(prefers-color-scheme:dark)').matches;r.dataset.theme=dark?'light':'dark';update();};
$('#mobbtn').onclick=()=>ctrl.classList.toggle('open');
$('#lgb').onclick=()=>{const l=$('#legend .lg');l.hidden=!l.hidden;$('#lgb').setAttribute('aria-expanded',!l.hidden);};
modal.addEventListener('click',e=>{if(e.target===modal)closeModal();});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(modal.classList.contains('open'))closeModal();else if(panel.classList.contains('open'))closePanel();}});
buildCtrl();update();globalPanel();closePanel();
window.__atlas={select,S:()=>S,update,byId,openCompare,openMeth};
})();
</script>
